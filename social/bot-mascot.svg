<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ebf8"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd95a"/><stop offset="1" stop-color="#e0a21c"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#012ca5"/><stop offset="1" stop-color="#00166a"/></linearGradient>
  </defs>
  <!-- signal waves -->
  <g fill="none" stroke="#cf0507" stroke-width="9" stroke-linecap="round">
    <path d="M300 70 a40 40 0 0 1 28 28"/><path d="M306 44 a68 68 0 0 1 48 48"/>
  </g>
  <!-- antenna -->
  <line x1="262" y1="118" x2="290" y2="84" stroke="#00166a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="293" cy="80" r="13" fill="#cf0507"/>
  <!-- body: SIM card shape with cut corner -->
  <path d="M120 112 H262 a20 20 0 0 1 20 20 V318 a22 22 0 0 1 -22 22 H130 a22 22 0 0 1 -22 -22 V148 Z" transform="translate(0,0)" fill="url(#body)" stroke="#00166a" stroke-width="9" stroke-linejoin="round"/>
  <!-- captain cap -->
  <path d="M116 150 C120 98 274 98 284 150 Z" fill="url(#cap)" stroke="#00166a" stroke-width="8" stroke-linejoin="round"/>
  <rect x="104" y="144" width="192" height="22" rx="11" fill="#00166a"/>
  <path d="M150 166 q50 20 100 0" fill="none" stroke="#00166a" stroke-width="0"/>
  <path d="M188 112 l12 -8 l12 8 l-4 14 h-16 z" fill="#f8c830"/>
  <!-- face -->
  <ellipse cx="166" cy="206" rx="15" ry="18" fill="#0b1233"/>
  <ellipse cx="234" cy="206" rx="15" ry="18" fill="#0b1233"/>
  <circle cx="171" cy="199" r="5.5" fill="#fff"/><circle cx="239" cy="199" r="5.5" fill="#fff"/>
  <ellipse cx="146" cy="236" rx="14" ry="8" fill="#ff8a8a" opacity=".55"/><ellipse cx="254" cy="236" rx="14" ry="8" fill="#ff8a8a" opacity=".55"/>
  <path d="M180 232 q20 22 40 0" fill="none" stroke="#0b1233" stroke-width="8" stroke-linecap="round"/>
  <!-- chip belly -->
  <rect x="160" y="262" width="80" height="58" rx="12" fill="url(#chip)" stroke="#a87100" stroke-width="5"/>
  <path d="M200 262 v58 M160 282 h80 M160 300 h80" stroke="#a87100" stroke-width="4"/>
  <!-- waving arm + chat bubble -->
  <path d="M110 250 q-34 -6 -40 -40" fill="none" stroke="#00166a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="68" cy="204" r="13" fill="#fff" stroke="#00166a" stroke-width="7"/>
  <path d="M290 262 q26 10 30 34" fill="none" stroke="#00166a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="320" cy="300" r="13" fill="#fff" stroke="#00166a" stroke-width="7"/>
  <!-- feet -->
  <rect x="146" y="336" width="34" height="18" rx="9" fill="#00166a"/><rect x="220" y="336" width="34" height="18" rx="9" fill="#00166a"/>
</svg>
