<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>3UK eSIM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button class="back hidden" id="backBtn" aria-label="Back">‹</button>
    <img src="img/logo.png" alt="" class="toplogo" id="topLogo">
    <h1 id="topTitle">3UK eSIM</h1>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="shop" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9M12 3c-2.6 2.6-3.8 5.6-3.8 9s1.2 6.4 3.8 9"/></svg>Shop</button>
    <button data-tab="esims"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-4M10 20v-8M15 20v-12M20 20V4"/></svg>My eSIMs</button>
    <button data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.4-6 8-6s6.5 2 8 6"/></svg>Account</button>
  </nav>

  <div class="sheet-bg hidden" id="sheetBg"></div>
  <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></section>
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
